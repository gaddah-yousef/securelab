name: SecureLab Security Pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Gitleaks (secret scanning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: python -m pip install "semgrep>=1.90,<2"
      - name: Scan repository
        run: semgrep scan --config p/owasp-top-ten --config p/docker --error --metrics=off .

  image-scan:
    name: Nginx configuration and image scan
    needs: [secrets-scan, sast]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build verified Nginx image
        run: docker build -t securelab-proxy:ci ./app
      - name: Nginx configuration smoke test
        run: docker run --rm securelab-proxy:ci nginx -t
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: securelab-proxy:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
