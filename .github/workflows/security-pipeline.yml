name: SecureLab Security Pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Gitleaks (secret scanning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Detect committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: python -m pip install "semgrep>=1.90,<2"
      - name: Scan repository
        run: semgrep scan --config p/owasp-top-ten --config p/docker --error --metrics=off .

  image-scan:
    name: Nginx configuration and image scan
    needs: [secrets-scan, sast]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build verified Nginx image
        run: docker build -t securelab-proxy:ci ./app
      - name: Nginx configuration smoke test
        run: docker run --rm securelab-proxy:ci nginx -t
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: securelab-proxy:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
