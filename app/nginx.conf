worker_processes auto;
events {
    worker_connections 1024;
}

http {
    # File logs are shared with Grafana Alloy in the isolated lab.
    log_format soc_format '$remote_addr - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent" '
                          'request_time=$request_time';

    access_log /var/log/securelab/access.log soc_format;
    error_log /var/log/securelab/error.log warn;

    server {
        listen 80;
        server_name _;

        # Research environment only, not a public reverse proxy.
        client_max_body_size 10m;

        location / {
            proxy_pass http://dvwa:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }
    }
}
