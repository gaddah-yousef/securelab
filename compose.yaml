name: securelab

# Intentionally vulnerable lab: bind UI ports to loopback only.
# Configure .env from .env.example before starting.
services:
  dvwa:
    image: vulnerables/web-dvwa:latest
    environment:
      MYSQL_ROOT_PASSWORD: ${DVWA_DB_PASSWORD:?Set DVWA_DB_PASSWORD in .env}
    networks:
      - app-internal
    restart: unless-stopped

  nginx-proxy:
    image: nginx:1.28-alpine
    depends_on:
      - dvwa
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./app/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-logs:/var/log/securelab
    networks:
      - app-internal
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.0
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./soc/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks:
      - monitoring
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.10.0
    command: ["run", "/etc/alloy/config.alloy"]
    depends_on:
      - loki
    volumes:
      - ./soc/config.alloy:/etc/alloy/config.alloy:ro
      - nginx-logs:/var/log/securelab:ro
    networks:
      - monitoring
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./soc/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - loki
    networks:
      - monitoring
    restart: unless-stopped

networks:
  app-internal:
    internal: true
  monitoring:
    internal: true

volumes:
  nginx-logs:
  loki-data:
  grafana-data:
